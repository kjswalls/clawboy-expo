<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 290" width="690" height="870">
  <defs>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#4DA3F0"/>
      <stop offset="25%"  stop-color="#F0A2B0"/>
      <stop offset="50%"  stop-color="#F4C842"/>
      <stop offset="75%"  stop-color="#4DA3F0"/>
      <stop offset="100%" stop-color="#4DA3F0"/>
    </linearGradient>
    <g id="tile" fill="white">
      <rect x="2"  y="2"  width="14" height="14" rx="3"/>
      <rect x="18" y="2"  width="14" height="14" rx="3"/>
      <rect x="34" y="2"  width="14" height="14" rx="3"/>
      <rect x="2"  y="18" width="14" height="14" rx="3"/>
      <rect x="22.5" y="22.5" width="5" height="5" rx="2.5"/>
      <rect x="34" y="18" width="14" height="14" rx="3"/>
      <rect x="2"  y="34" width="14" height="14" rx="3"/>
      <rect x="18" y="34" width="14" height="14" rx="3"/>
      <rect x="34" y="34" width="14" height="14" rx="3"/>
    </g>
    <mask id="fieldMask" maskUnits="userSpaceOnUse" x="0" y="0" width="230" height="290">
      <rect width="230" height="290" fill="black"/>
      <use href="#tile" x="0"   y="0"/>
      <use href="#tile" x="60"  y="0"/>
      <use href="#tile" x="120" y="0"/>
      <use href="#tile" x="180" y="0"/>
      <use href="#tile" x="0"   y="60"/>
      <use href="#tile" x="60"  y="60"/>
      <use href="#tile" x="120" y="60"/>
      <use href="#tile" x="180" y="60"/>
      <use href="#tile" x="0"   y="120"/>
      <use href="#tile" x="60"  y="120"/>
      <use href="#tile" x="120" y="120"/>
      <use href="#tile" x="180" y="120"/>
      <use href="#tile" x="0"   y="180"/>
      <use href="#tile" x="60"  y="180"/>
      <use href="#tile" x="120" y="180"/>
      <use href="#tile" x="180" y="180"/>
      <use href="#tile" x="0"   y="240"/>
      <use href="#tile" x="60"  y="240"/>
      <use href="#tile" x="120" y="240"/>
      <use href="#tile" x="180" y="240"/>
    </mask>
  </defs>
  <rect width="230" height="290" fill="url(#rainbow)" mask="url(#fieldMask)"/>
</svg>
